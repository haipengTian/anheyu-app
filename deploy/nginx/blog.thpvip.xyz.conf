# [custom] 主机 nginx 站点配置：blog.thpvip.xyz → 本机 127.0.0.1:8091（anheyu 容器）
# 放到 /etc/nginx/conf.d/blog.thpvip.xyz.conf；证书由 certbot 签发（见 deploy/README.md）

server {
    listen 80;
    listen [::]:80;
    server_name blog.thpvip.xyz;

    # certbot webroot 验证（与本机其他站点共用 /var/www/certbot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.thpvip.xyz;

    # certbot 签发（与本机 sou/hg/dsh.thpvip.xyz 相同方式）
    ssl_certificate     /etc/letsencrypt/live/blog.thpvip.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.thpvip.xyz/privkey.pem;

    # 后台上传按 25MB 分片，插件安装包最大 100MB
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
